# Android app (android/, #29): the web GUI in a WebView with a USB bridge, for head units.
# Push: APK as artifact; tag v*: APK to the GitHub release. The runner image brings the Android SDK.
name: android
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags for the version
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # version from the last tag: v1.2.0 -> 1.2.0, 5 commits later -> 1.2.0-5-gabc1234
          d=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long 2>/dev/null || echo "v0.0.0-$(git rev-list --count HEAD)-g${GITHUB_SHA::7}")
          tag=${d%-*-*}; n=${d#"$tag"-}; n=${n%%-*}; base=${tag#v}
          IFS=. read -r x y z <<<"${base%%-*}"
          v="$base"; [ "$n" = 0 ] || v="$base-$n-g${GITHUB_SHA::7}"
          [ "$n" -gt 999 ] && n=999
          code=$(( ((x*100+y)*100+z)*1000 + n ))
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::no release key (secret ANDROID_KEYSTORE): a release must not carry a debug-signed APK"; exit 1
          else
            echo "::warning::no release key: debug-signed"
          fi
          echo "version $v, code $code"
          gradle -p android assembleRelease -PversionName="$v" -PversionCode="$code"
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/forge-dsp-$v-android.apk"
          # test rig (android/test-rig): debuggable build, never released
          gradle -p android assembleDebug -PversionName="$v-debug" -PversionCode="$code"
          mkdir -p out-debug
          cp android/app/build/outputs/apk/debug/*.apk "out-debug/forge-dsp-$v-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: out-debug/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=()
          [ -f "docs/releases/$v.md" ] && notes=(--notes-file "docs/releases/$v.md")
          # the desktop workflow may create it at the same time
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Forge DSP GUI $v" "${notes[@]}" || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --clobber out/*.apk
          # the APK into SHA256SUMS (the desktop workflow writes the rest; the app checks against it)
          (cd out && sha256sum *.apk) > "$RUNNER_TEMP/own"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O "$RUNNER_TEMP/old" 2>/dev/null || : > "$RUNNER_TEMP/old"
          { awk 'NR==FNR{own[$2]=1;next} !($2 in own)' "$RUNNER_TEMP/own" "$RUNNER_TEMP/old"; cat "$RUNNER_TEMP/own"; } | sort -k2 > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$GITHUB_REF_NAME" --clobber "$RUNNER_TEMP/SHA256SUMS"
